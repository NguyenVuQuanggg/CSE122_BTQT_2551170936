<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="bai16.css">
</head>
<body>

    <div class="todo-container">
        <!-- Tiêu đề -->
        <div class="todo-header">
            <h3 class="fw-bold mb-1">Danh sách việc cần làm</h3>
            <p class="mb-0 small opacity-75">Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="p-4">
            <!-- Ô nhập + nút Thêm -->
            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control py-2 px-3" placeholder="Nhập việc cần làm...">
                <button class="btn btn-purple px-4 fw-semibold" onclick="addTask()">Thêm</button>
            </div>

            <!-- Danh sách công việc -->
            <div id="taskList" class="mb-4">
                <!-- Công việc 1 -->
                <div class="todo-item">
                    <div class="d-flex align-items-center gap-3">
                        <input type="checkbox" class="todo-checkbox" onclick="toggleTask(this)">
                        <span class="task-text">Đọc chương HTML5 cơ bản</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
                </div>

                <!-- Công việc 2 -->
                <div class="todo-item">
                    <div class="d-flex align-items-center gap-3">
                        <input type="checkbox" class="todo-checkbox" onclick="toggleTask(this)">
                        <span class="task-text">Làm bài tập CSS Grid</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
                </div>

                <!-- Công việc 3 -->
                <div class="todo-item">
                    <div class="d-flex align-items-center gap-3">
                        <input type="checkbox" class="todo-checkbox" onclick="toggleTask(this)">
                        <span class="task-text">Quay video OBS nộp bài</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(this)">Xoá</button>
                </div>
            </div>

            <!-- Thống kê số việc chưa hoàn thành -->
            <div class="text-muted small" id="taskCount">
                Còn 3 việc chưa hoàn thành
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
