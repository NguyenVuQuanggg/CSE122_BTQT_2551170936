<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính cá nhân</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Liên kết file CSS tùy chỉnh -->
    <link rel="stylesheet" href="bai15.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-white">

    <!-- Vỏ máy tính -->
    <div class="calculator-container p-3 shadow-lg">
        
        <!-- Màn hình hiển thị -->
        <div class="calculator-screen p-3 mb-3 text-end rounded-2">
            <div id="expression" class="screen-expr">12 + 8 × 3</div>
            <div id="result" class="screen-res">36</div>
        </div>

        <!-- Bàn phím lưới 4 cột -->
        <div class="container-fluid p-0">
            <!-- Hàng 1 -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-calc btn-c w-100 py-3 fw-bold" onclick="clearScreen()">C</button></div>
                <div class="col-3"><button class="btn btn-calc btn-op w-100 py-3 fw-bold" onclick="appendValue('()')">( )</button></div>
                <div class="col-3"><button class="btn btn-calc btn-op w-100 py-3 fw-bold" onclick="appendValue('%')">%</button></div>
                <div class="col-3"><button class="btn btn-calc btn-operator w-100 py-3 fw-bold" onclick="appendValue('/')">÷</button></div>
            </div>
            <!-- Hàng 2 -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('7')">7</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('8')">8</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('9')">9</button></div>
                <div class="col-3"><button class="btn btn-calc btn-operator w-100 py-3 fw-bold" onclick="appendValue('*')">×</button></div>
            </div>
            <!-- Hàng 3 -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('4')">4</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('5')">5</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('6')">6</button></div>
                <div class="col-3"><button class="btn btn-calc btn-operator w-100 py-3 fw-bold" onclick="appendValue('-')">-</button></div>
            </div>
            <!-- Hàng 4 -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('1')">1</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('2')">2</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('3')">3</button></div>
                <div class="col-3"><button class="btn btn-calc btn-operator w-100 py-3 fw-bold" onclick="appendValue('+')">+</button></div>
            </div>
            <!-- Hàng 5 -->
            <div class="row g-2">
                <div class="col-6"><button class="btn btn-calc btn-num w-100 py-3 fw-bold text-start ps-4" onclick="appendValue('0')">0</button></div>
                <div class="col-3"><button class="btn btn-calc btn-num w-100 py-3 fw-bold" onclick="appendValue('.')">.</button></div>
                <div class="col-3"><button class="btn btn-calc btn-equal w-100 py-3 fw-bold" onclick="calculate()">=</button></div>
            </div>
        </div>

    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
