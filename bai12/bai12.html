<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch cá nhân</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng file CSS tự viết -->
    <link rel="stylesheet" href="bai12.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <!-- Khung lịch chính -->
    <div class="card shadow-lg p-4 rounded-4 calendar-main-card" style="width: 500px;">
        
        <!-- Phần hiển thị kết quả lịch (Ô phía trên) -->
        <div class="card border rounded-3 p-4 text-center mb-4 calendar-display-box">
            <div id="hienThiNam" class="text-danger fw-bold" style="font-size: 20px;">2026</div>
            <div id="hienThiThang" class="text-primary fw-bold" style="font-size: 18px;">Tháng 12</div>
            <div id="hienThiNgay" class="text-danger fw-bold my-2" style="font-size: 72px; line-height: 1;">24</div>
            <div id="hienThiThu" class="text-primary fw-bold" style="font-size: 18px;">Thứ hai</div>
        </div>

        <!-- Lời chào theo buổi -->
        <div class="text-center mb-4">
            <h4 id="hienThiLoiChao" class="text-danger fst-italic">Chào buổi sáng!</h4>
        </div>

        <!-- Form nhập liệu và nút In lịch -->
        <div class="border border-primary rounded-3 p-3">
            <div class="row g-2 align-items-center">
                <!-- Ô nhập Ngày -->
                <div class="col">
                    <label class="form-label text-center d-block fw-semibold mb-1" style="font-size: 14px;">Ngày</label>
                    <input type="number" id="inputNgay" class="form-control text-center" value="24" min="1" max="31">
                </div>
                <!-- Ô nhập Tháng -->
                <div class="col">
                    <label class="form-label text-center d-block fw-semibold mb-1" style="font-size: 14px;">Tháng</label>
                    <input type="number" id="inputThang" class="form-control text-center" value="12" min="1" max="12">
                </div>
                <!-- Ô nhập Năm -->
                <div class="col">
                    <label class="form-label text-center d-block fw-semibold mb-1" style="font-size: 14px;">Năm</label>
                    <input type="number" id="inputNam" class="form-control text-center" value="2026">
                </div>
                <!-- Nút In lịch -->
                <div class="col-auto d-flex align-items-end">
                    <button id="btnInLich" class="btn btn-secondary text-white px-3 py-2" style="background-color: #536878; border-color: #536878;">
                        In<br>lịch
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Nhúng file JavaScript xử lý sự kiện -->
    <script src="script.js"></script>
</body>
</html>
