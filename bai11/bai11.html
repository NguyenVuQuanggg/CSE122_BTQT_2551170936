<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 - Thư viện ảnh (figure / figcaption)</title>
    <!-- Kết nối đến file CSS bên ngoài -->
    <link rel="stylesheet" href="bai11.css">
</head>
<body>

    <!-- Tiêu đề và mô tả đầu trang -->
    <header>
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
    </header>

    <!-- Thư viện 6 ảnh danh thắng (lưới 3 cột) -->
    <main class="gallery">

        <figure>
            <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
            <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>

        <figure>
            <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">
            <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>

        <figure>
            <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
            <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>

        <figure>
            <img src="4-fansipan.jpg" alt="Fansipan">
            <figcaption>Hình 4. Fansipan</figcaption>
        </figure>

        <figure>
            <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
            <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>

        <figure>
            <img src="6-phong-nha.jpg"Động Phong Nha">
            <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>

    </main>

</body>
</html>
