<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 21 - Hệ thống bài tập Lập trình Web</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Nhúng file bai21.css cùng thư mục -->
    <link rel="stylesheet" href="bai21.css">
</head>
<body>

    <!-- VÙNG 1: BANNER TÊN CÙNG -->
    <header class="banner p-3 d-flex align-items-center">
        <img src="LogoTT.gif" alt="Logo" class="me-3">
    </header>

    <!-- BỐ CỤC CHÍNH BẰNG BOOTSTRAP GRID -->
    <div class="container-fluid">
        <div class="row">

            <!-- VÙNG 2: MENU DỌC BÊN TRÁI -->
            <nav class="col-md-3 col-lg-2 sidebar-menu p-0">
                <ul>
                    <li><a href="#" class="active">Ngôn ngữ HTML</a></li>
                    <li><a href="#">Ngôn ngữ JavaScript</a></li>
                    <li><a href="#">Các đối tượng trong JavaScript</a></li>
                    <li><a href="#">CSS và bố cục hiện đại</a></li>
                </ul>
            </nav>

            <!-- VÙNG 3: NỘI DUNG CHÍNH Ó GIỮA -->
            <main class="col-md-6 col-lg-8 p-4">
                <h3 class="content-title mb-3">Bài tập HTML cơ bản</h3>

                <!-- Hộp menu con màu vàng -->
                <div class="sub-menu-box mb-3 d-flex flex-wrap gap-2 align-items-center">
                    • <span class="sub-menu-item" data-action="dao-chuoi">Đảo chuỗi</span>
                    • <span class="sub-menu-item" data-action="phan-tich">Phân tích chuỗi</span>
                    • <span class="sub-menu-item" data-action="tim-thay-the">Tìm và thay thế</span>
                </div>

                <!-- Khung viền trắng -->
                <div class="content-box">
                    <p class="text-start mb-4">Thiết kế trang web có nội dung như sau:</p>
                    <p class="fw-bold mb-1">Trung Tâm Tin học – ĐH KHTN</p>
                    <p class="mb-0">Chào mừng các bạn đến với ngôn ngữ HTML</p>
                </div>
            </main>

            <!-- VÙNG 4: CỘT QUẢNG CÁO BÊN PHẢI -->
            <aside class="col-md-3 col-lg-2 ads-column p-3">
                <div class="mb-2">
                    <img src="Qcao01.gif" alt="Quảng cáo 1" class="img-fluid">
                </div>
                <div>
                    <img src="Qcao02.gif" alt="Quảng cáo 2" class="img-fluid">
                </div>
            </aside>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Nhúng file bai21.js cùng thư mục -->
    <script src="bai21.js"></script>
