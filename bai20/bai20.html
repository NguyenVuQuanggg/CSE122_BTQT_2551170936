<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20 - Hiệu ứng ảnh và chữ</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Liên kết file CSS tùy chỉnh -->
    <link rel="stylesheet" href="bai20.css">
</head>s
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="container text-center main-container p-4">
        
        <!-- Khung chứa ảnh và chữ (Nền #1c2226, bo góc 12px) -->
        <div class="display-box p-4 mb-4 mx-auto shadow-lg">
            <!-- Ảnh hoa hồng -->
            <div class="mb-3">
                <img id="roseImage" src="hoahong.gif" alt="Hoa hồng" class="img-effect grayscale">
            </div>
            <!-- Dòng chữ: gradient vàng gold, in nghiêng -->
            <div class="special-text fst-italic">
                Special For You
            </div>
        </div>

        <!-- Thanh nút bấm áp dụng hiệu ứng (13 nút) -->
        <div class="button-toolbar mx-auto">
            <button class="btn btn-effect active" onclick="applyEffect('gray', this)">Gray</button>
            <button class="btn btn-effect" onclick="applyEffect('xray', this)">Xray</button>
            <button class="btn btn-effect" onclick="applyEffect('invert', this)">Invert</button>
            <button class="btn btn-effect" onclick="applyEffect('fliph', this)">FlipH</button>
            <button class="btn btn-effect" onclick="applyEffect('flipv', this)">FlipV</button>
            <button class="btn btn-effect" onclick="applyEffect('glow', this)">Glow</button>
            <button class="btn btn-effect" onclick="applyEffect('shadow', this)">Shadow</button>
            <button class="btn btn-effect" onclick="applyEffect('boldshadow', this)">Bold Shadow</button>
            <button class="btn btn-effect" onclick="applyEffect('dropshadow', this)">DropShadow</button>
            <button class="btn btn-effect" onclick="applyEffect('blur', this)">Blur</button>
            <button class="btn btn-effect" onclick="applyEffect('wave', this)">Wave</button>
            <button class="btn btn-effect" onclick="applyEffect('mask', this)">Mask</button>
            <button class="btn btn-effect" onclick="applyEffect('alpha', this)">Alpha</button>
        </div>

    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
