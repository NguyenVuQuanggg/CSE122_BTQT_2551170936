<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh — Hiệu ứng Hover</title>
    
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Nhúng file CSS tự viết -->
    <link rel="stylesheet" href="bai23.css">
</head>
<body class="bg-light py-5">

    <div class="container my-3">
        
        <!-- PHẦN TIÊU ĐỀ ĐẦU TRANG -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark">Thư viện ảnh — Hiệu ứng Hover</h1>
            <p class="text-secondary fs-6">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </div>

        <!-- LƯỚI 6 ẢNH DÙNG BOOTSTRAP GRID (Row - Col-md-4) -> 3 cột ở màn hình trung bình/lớn -->
        <div class="row g-4">
            
            <!-- Ảnh 1: Vịnh Hạ Long -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Halong.jpg" alt="Vịnh Hạ Long" onerror="this.src='https://images.unsplash.com/photo-1528127269322-539801943592?w=600&q=80'">
                    <div class="gallery-overlay">Vịnh Hạ Long</div>
                </div>
            </div>

            <!-- Ảnh 2: Hang Sơn Đoòng -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Sondoong.jpg" alt="Hang Sơn Đoòng" onerror="this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&q=80'">
                    <div class="gallery-overlay">Hang Sơn Đoòng</div>
                </div>
            </div>

            <!-- Ảnh 3: Thác Bản Giốc -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Bangioc.jpg" alt="Thác Bản Giốc" onerror="this.src='https://images.unsplash.com/photo-1628102491629-778571d893a3?w=600&q=80'">
                    <div class="gallery-overlay">Thác Bản Giốc</div>
                </div>
            </div>

            <!-- Ảnh 4: Fansipan -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Fansipan.jpg" alt="Fansipan" onerror="this.src='https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600&q=80'">
                    <div class="gallery-overlay">Fansipan</div>
                </div>
            </div>

            <!-- Ảnh 5: Đồng bằng sông Cửu Long -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Cuulong.jpg" alt="Đồng bằng sông Cửu Long" onerror="this.src='https://images.unsplash.com/photo-1583417319070-4a69db38a482?w=600&q=80'">
                    <div class="gallery-overlay">Đồng bằng sông Cửu Long</div>
                </div>
            </div>

            <!-- Ảnh 6: Động Phong Nha -->
            <div class="col-12 col-md-4">
                <div class="gallery-item">
                    <img src="Phongnha.jpg" alt="Động Phong Nha" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80'">
                    <div class="gallery-overlay">Động Phong Nha</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Nhúng file JS tự viết -->
    <script src="bai23.js"></script>
</body>
</html>
