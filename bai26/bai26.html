<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham gia CLB Lập trình Web</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng tệp CSS tự viết -->
    <link rel="stylesheet" href="bai26.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Thẻ Form chính -->
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    
                    <!-- Tiêu đề thẻ (Header màu xanh success) -->
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
                    </div>

                    <!-- Nội dung form -->
                    <div class="card-body p-4 p-md-5">
                        <form id="formDangKy">
                            
                            <!-- Hàng 1: Họ và tên & Mã sinh viên -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="hoTen" class="form-label">Họ và tên</label>
                                    <input type="text" class="form-control" id="hoTen" value="Nguyễn Văn A">
                                </div>
                                <div class="col-md-6">
                                    <label for="maSv" class="form-label">Mã sinh viên</label>
                                    <input type="text" class="form-control" id="maSv" value="22xxxxxx">
                                </div>
                            </div>

                            <!-- Hàng 2: Email & Số điện thoại -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" value="sv@tlu.edu.vn">
                                </div>
                                <div class="col-md-6">
                                    <label for="sdt" class="form-label">Số điện thoại</label>
                                    <input type="text" class="form-control" id="sdt" value="09xxxxxxxx">
                                </div>
                            </div>

                            <!-- Trình độ (Radio buttons dạng inline) -->
                            <div class="mb-3">
                                <label class="form-label d-block">Trình độ</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="coBan" checked>
                                    <label class="form-check-label" for="coBan">Cơ bản</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="kha">
                                    <label class="form-check-label" for="kha">Khá</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="tot">
                                    <label class="form-check-label" for="tot">Tốt</label>
                                </div>
                            </div>

                            <!-- Chọn lớp (Select dropdown) -->
                            <div class="mb-3">
                                <label for="chonLop" class="form-label">Chọn lớp</label>
                                <select class="form-select" id="chonLop">
                                    <option selected>67CNTT1</option>
                                    <option value="1">67CNTT2</option>
                                    <option value="2">67CNTT3</option>
                                    <option value="3">67CNTT4</option>
                                </select>
                            </div>

                            <!-- Cam kết (Checkbox) -->
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="camKet" checked>
                                    <label class="form-check-label" for="camKet">
                                        Tôi cam kết tự làm bài và quay video OBS
                                    </label>
                                </div>
                            </div>

                            <!-- Nút bấm (Nhập lại & Đăng ký) -->
                            <div class="d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                                <button type="submit" class="btn btn-success px-4" id="btnSubmit">Đăng ký</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nhúng tệp JavaScript tự viết riêng -->
    <script src="script.js"></script>
</body>
</html>
