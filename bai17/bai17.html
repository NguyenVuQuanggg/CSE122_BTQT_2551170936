<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 - Kiểm tra biểu mẫu bằng JavaScript</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Liên kết file CSS tùy chỉnh -->
    <link rel="stylesheet" href="bai17.css">
</head>
<body>

    <div class="container my-5">
        <!-- Tiêu đề đầu trang giống hình mẫu -->
        <div class="row mb-4">
            <div class="col-12">
                <h3 class="main-title p-3 rounded">Bài 17 — Kiểm tra biểu mẫu bằng JavaScript</h3>
            </div>
        </div>

        <!-- Khung Form đăng ký -->
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="form-container p-4 p-md-5">
                    
                    <div class="mb-4">
                        <h4 class="form-heading fw-bold">Đăng ký tài khoản</h4>
                        <p class="form-subtext text-muted small">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
                    </div>

                    <form id="registerForm" onsubmit="return validateForm()">
                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Họ và tên</label>
                            <input type="text" id="fullname" class="form-control" placeholder="Nhập họ và tên...">
                            <div id="fullnameError" class="error-msg"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email</label>
                            <input type="text" id="email" class="form-control" placeholder="Nhập địa chỉ email...">
                            <div id="emailError" class="error-msg"></div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu...">
                            <div id="passwordError" class="error-msg"></div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Xác nhận mật khẩu</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu...">
                            <div id="confirmError" class="error-msg"></div>
                        </div>

                        <!-- Nút Đăng ký -->
                        <button type="submit" class="btn btn-submit w-100 py-3 fw-bold">Đăng ký</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
